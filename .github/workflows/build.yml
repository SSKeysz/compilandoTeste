name: Build EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  NOME_EXE: remotecontrol   # nome do exe gerado (menu.exe). Troque aqui se quiser outro.

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask pillow

      - name: Checar se o codigo compila
        run: python -m py_compile painel.py

      - name: Compilar exe (sem janela de CMD)
        run: pyinstaller --onefile --noconsole --clean --name $env:NOME_EXE painel.py

      - name: Enviar exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME_EXE }}-exe
          path: dist/${{ env.NOME_EXE }}.exe
