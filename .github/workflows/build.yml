name: Build EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask

      - name: Compilar painel.exe
        run: pyinstaller --onefile --name painel painel.py

      - name: Enviar painel.exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: painel-exe
          path: dist/painel.exe
